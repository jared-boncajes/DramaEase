org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Lowest Android version the APK will install on. Raise or lower to match your Sony BRAVIA:
#   Android TV 8.x  -> API 26 (default)      Android TV 9   -> API 28
#   Android TV 10   -> API 29                Google TV 11+  -> API 30+
# Override on the command line:  gradlew assembleDebug -Pdramaease.minSdk=28
dramaease.minSdk=26
